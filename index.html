<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Generator - Taicon Solar Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f48240;
            --dark: #2c2541;
            --text: #000000;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(244, 130, 64, 0.3);
        }

        .btn-primary:hover {
            background: #e06d2a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--dark);
            color: white;
        }

        .btn-secondary:hover {
            background: #1a1528;
            transform: translateY(-2px);
        }

        /* Document Styling */
        .document-wrapper {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .document-container {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            flex-shrink: 0;
        }

        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
        }

        .document-content {
            padding: 40px 50px;
            padding-top: 70px;
            padding-bottom: 70px;
            position: relative;
            z-index: 2;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 15px;
        }

        .logo {
            font-family: serif;
            position: relative;
        }

        .logo .t {
            color: var(--primary);
            font-size: 65px;
            font-weight: 800;
            font-style: italic;
            line-height: 1;
            display: inline-block;
        }

        .logo .text {
            color: var(--primary);
            font-size: 40px;
            font-weight: 800;
            margin-left: -12px;
            display: inline-block;
        }

        .logo .subtext {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin-top: 5px;
            position: relative;
        }

        .contact-info {
            text-align: right;
            font-size: 12px;
            line-height: 1.6;
            color: black;
            font-weight: 600;
        }

        hr.divider {
            border: 0;
            border-top: 3px solid var(--dark);
            margin: 20px 0;
        }

        .title-area {
            text-align: center;
            margin: 30px 0;
        }

        .quote-input {
            font-size: 26px;
            color: var(--primary);
            text-align: center;
            border: none;
            border-bottom: 2px dotted #ccc;
            width: 70%;
            outline: none;
            background: transparent;
            font-weight: 700;
            font-family: inherit;
            text-transform: uppercase;
        }

        .meta-area {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 15px;
            color: black;
        }

        .meta-area input {
            border: none;
            border-bottom: 1px dotted #888;
            outline: none;
            margin-left: 10px;
            font-family: inherit;
            font-size: 15px;
            background: transparent;
            color: black;
            font-weight: 600;
            padding-bottom: 3px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
            table-layout: fixed;
        }

        .items-table th {
            padding: 12px 5px;
            font-weight: 800;
            border-bottom: 2px solid black;
            text-align: left;
            color: black;
        }

        .items-table th.center,
        .items-table td.center {
            text-align: center;
        }

        .items-table th:nth-child(3),
        .items-table td:nth-child(3),
        .items-table th:nth-child(4),
        .items-table td:nth-child(4) {
            border-left: 1px dotted black;
        }

        .items-table td {
            padding: 8px 5px;
            border-bottom: 1px solid black;
            font-weight: 600;
            color: black;
        }

        .items-table td.desc {
            white-space: normal;
        }

        .items-table td.desc span {
            margin-right: 8px;
            font-size: 18px;
            line-height: 1;
            vertical-align: middle;
            display: inline-block;
        }

        .items-table input {
            width: 90%;
            border: none;
            background: transparent;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            color: black;
            padding: 4px;
        }

        .items-table td.desc input[type="text"] {
            text-align: left;
            width: 85%;
            vertical-align: middle;
            display: inline-block;
        }

        .items-table input:hover,
        .items-table input:focus {
            background: rgba(244, 130, 64, 0.05);
            border-radius: 4px;
        }

        .grand-total-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 40px;
        }

        .grand-total-box {
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            border-bottom: 2px solid black;
            padding-bottom: 8px;
            font-size: 16px;
            color: black;
        }

        .grand-total-box input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 18px;
            font-weight: 800;
            text-align: right;
            outline: none;
            color: black;
            width: 150px;
        }

        .thank-you {
            text-align: right;
            margin-top: 20px;
            font-size: 12px;
            font-weight: 800;
            font-style: italic;
            color: black;
            text-transform: uppercase;
        }

        /* Watermark */
        .watermark {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.04;
            text-align: center;
            pointer-events: none;
            z-index: 0;
        }

        .watermark .t {
            color: var(--primary);
            font-size: 200px;
            font-weight: 800;
            font-family: serif;
            font-style: italic;
        }

        .watermark .text {
            color: var(--primary);
            font-size: 140px;
            font-weight: 800;
            font-family: serif;
        }

        .watermark .sub {
            font-size: 40px;
            color: black;
            font-weight: 800;
            margin-top: -30px;
        }

        /* Hide arrows from number inputs */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // Set today's date default
        document.getElementById('quoteDate').valueAsDate = new Date();

        // Default item list from the provided image
        const itemsList = [
            "Solar Panel",
            "Solar Inverter",
            "Lithium Battery",
            "Solar Stand (14 Gauge)",
            "Distribution Box Complete",
            "DC Wire Coil (90Y)",
            "AC Wire Coil (90Y)",
            "Installation Charges",
            "Earthing & Boring Complete (AC+DC)",
            "Net Metering Complete",
            "Mix Hardware Accessories"
        ];

        const tbody = document.getElementById('itemsBody');

        // Function to create a row
        function createRow(itemText = "") {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="desc"><span>&bull;</span> <input type="text" value="${itemText}" placeholder="Item Description"></td>
                <td class="center"><input type="text" class="qty" placeholder=""></td>
                <td class="center">
                    <div style="display: flex; justify-content: center; align-items: center; gap: 4px;">
                        <input type="text" class="price" placeholder="Price" style="width: 55px; text-align: right;">
                        <select class="price-op" style="font-weight: 700; font-size: 13px; color: #444; border: none; background: transparent; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; padding: 0 2px;">
                            <option value="x">x</option>
                            <option value="+">+</option>
                            <option value="-">-</option>
                        </select>
                        <input type="text" class="price-mult" placeholder="Qty" style="width: 30px; text-align: left;">
                    </div>
                </td>
                <td class="center"><input type="text" class="row-total" value="0"></td>
            `;
            tbody.appendChild(tr);

            // Bind events for this specific row
            const qtyInput = tr.querySelector('.qty');
            const priceInput = tr.querySelector('.price');
            const opInput = tr.querySelector('.price-op');
            const multInput = tr.querySelector('.price-mult');
            const totalInput = tr.querySelector('.row-total');

            const calcEvent = function () {
                const priceStr = priceInput.value.replace(/[^0-9.]/g, '');
                const multStr = multInput.value.replace(/[^0-9.]/g, '');
                const price = parseFloat(priceStr) || 0;
                let mult = 0;
                
                if (multStr !== '') {
                    mult = parseFloat(multStr) || 0;
                } else if (opInput.value === 'x') {
                    // Default multiplier to 1 if empty and operator is multiply
                    mult = 1;
                }
                
                let total = 0;
                if (opInput.value === 'x') {
                    total = price * mult;
                } else if (opInput.value === '+') {
                    total = price + mult;
                } else if (opInput.value === '-') {
                    total = price - mult;
                }
                
                totalInput.value = (price > 0 || total > 0) ? 'Rs ' + total.toLocaleString('en-US') : '';
                calculateGrandTotal();
            };

            priceInput.addEventListener('input', calcEvent);
            multInput.addEventListener('input', calcEvent);
            opInput.addEventListener('change', calcEvent);
            
            priceInput.addEventListener('change', function(e) {
                const val = e.target.value.replace(/[^0-9.]/g, '');
                if (val !== '') {
                    e.target.value = parseFloat(val).toLocaleString('en-US');
                }
            });

            totalInput.addEventListener('input', calculateGrandTotal);
        }

        // Initialize default rows
        itemsList.forEach(item => createRow(item));

        // Add empty row button functionality
        document.getElementById('addEmptyRowBtn').addEventListener('click', () => {
            createRow();
        });

        // Calculate Grand Total
        function calculateGrandTotal() {
            let grand = 0;
            document.querySelectorAll('.row-total').forEach(el => {
                const val = el.value.replace(/[^0-9.]/g, '');
                grand += parseFloat(val) || 0;
            });
            document.getElementById('grandTotal').value = grand > 0 ? 'Rs ' + grand.toLocaleString('en-US') : '';
        }

        // --- PDF GENERATION WITH PERFECT RENDERING ---
        document.getElementById('downloadBtn').addEventListener('click', function () {
            const element = document.getElementById('quotation-document');
            const originalBtnText = this.innerHTML;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
            this.disabled = true;

            // 1. Convert all inputs and selects to plain text spans for flawless PDF output
            const inputs = element.querySelectorAll('input, select');
            const replacements = [];

            inputs.forEach(input => {
                const span = document.createElement('span');
                
                // Copy styles
                const computedStyle = window.getComputedStyle(input);
                span.style.fontFamily = computedStyle.fontFamily;
                span.style.fontSize = computedStyle.fontSize;
                span.style.fontWeight = computedStyle.fontWeight;
                span.style.color = computedStyle.color;
                span.style.textAlign = computedStyle.textAlign;
                span.style.whiteSpace = 'nowrap';
                span.style.display = 'inline-block';
                span.style.width = computedStyle.width !== 'auto' ? computedStyle.width : (input.style.width || '100%');
                span.style.height = computedStyle.height !== 'auto' ? computedStyle.height : '';
                
                // Set text value
                if (input.type === 'date') {
                    // Format date nicely (DD-MM-YYYY)
                    if(input.value) {
                        const [y, m, d] = input.value.split('-');
                        span.innerText = `${d}-${m}-${y}`;
                    } else {
                        span.innerHTML = '&nbsp;';
                    }
                } else {
                    if (input.classList.contains('price-op')) {
                        const multInput = input.nextElementSibling;
                        if (!multInput || multInput.value.trim() === '') {
                            span.innerHTML = '';
                        } else {
                            span.innerText = input.value;
                        }
                    } else if (!input.value) {
                        span.innerHTML = '&nbsp;';
                    } else {
                        span.innerText = input.value;
                    }
                }

                // Preserve specific bottom borders for header inputs
                if (input.classList.contains('quote-input') || input.closest('.meta-area')) {
                    span.style.borderBottom = computedStyle.borderBottom;
                    span.style.paddingBottom = computedStyle.paddingBottom;
                }

                if (input.classList.contains('qty')) {
                    span.style.display = 'block';
                    span.style.width = 'calc(100% + 250px)';
                    span.style.marginLeft = '-250px';
                    span.style.textAlign = 'right';
                    span.style.whiteSpace = 'pre-wrap';
                    span.style.overflowWrap = 'break-word';
                    span.style.wordBreak = 'break-all';
                    
                    input.parentNode.insertBefore(span, input);
                    input.style.display = 'none';
                    replacements.push({ input, span });
                } else {
                    input.parentNode.insertBefore(span, input);
                    input.style.display = 'none';
                    replacements.push({ input, span });
                }
            });

            // 2. Configuration for html2pdf
            const opt = {
                margin: 0,
                filename: 'Taicon-Solar-Quotation.pdf',
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // 3. Generate PDF
            html2pdf().set(opt).from(element).save().then(() => {
                // 4. Restore inputs
                replacements.forEach(({ input, span }) => {
                    span.remove();
                    input.style.display = '';
                });
                this.innerHTML = originalBtnText;
                this.disabled = false;
            }).catch(err => {
                console.error("PDF Generation Error", err);
                this.innerHTML = originalBtnText;
                this.disabled = false;
                alert("An error occurred while generating the PDF.");
                
                // Restore inputs on error too
                replacements.forEach(({ input, span }) => {
                    span.remove();
                    input.style.display = '';
                });
            });
        });

    </script>
